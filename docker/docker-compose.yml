services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aeon
      POSTGRES_PASSWORD: aeon
      POSTGRES_DB: aeon7080
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      AEON_DATABASE_URL: postgresql+psycopg://aeon:aeon@postgres:5432/aeon7080
      AEON_SECRET: change-me
      AEON_STORAGE: /app/storage
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ../storage:/app/storage
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    environment:
      AEON_API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
